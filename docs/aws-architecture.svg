<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000"
  role="img" aria-labelledby="title desc">
  <title id="title">Product Service AWS architecture</title>
  <desc id="desc">Customer requests flow through CloudFront and a private S3 frontend to a WAF-protected public HTTPS Application Load Balancer, private ECS Fargate tasks and private RDS MySQL. Cognito provides customer identity. The separate Orders Lambda writes to DynamoDB. GitHub, CodePipeline, CodeBuild, ECR and CodeDeploy provide delivery.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#526579"/>
    </marker>
    <marker id="deployArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0 0L10 4L0 8Z" fill="#a33bab"/>
    </marker>
  </defs>
  <style>
    .bg{fill:#fff}.outer{fill:#f8fafb;stroke:#232f3e;stroke-width:2}
    .internet{fill:#fff7ec;stroke:#d97706;stroke-width:2}
    .publicNet{fill:#eff6ff;stroke:#3b82f6;stroke-width:2}
    .privateNet{fill:#effaf3;stroke:#2d8b57;stroke-width:2}
    .delivery{fill:#fbf3fc;stroke:#a33bab;stroke-width:2}
    .card{fill:#fff;stroke:#d2dbe4;stroke-width:1.5}
    .title{font:700 30px Arial,sans-serif;fill:#172b3a}
    .section{font:700 17px Arial,sans-serif;fill:#405466}
    .service{font:700 14px Arial,sans-serif;fill:#172b3a}
    .sub{font:12px Arial,sans-serif;fill:#526579}
    .edge{fill:none;stroke:#526579;stroke-width:2.5;marker-end:url(#arrow)}
    .authEdge{fill:none;stroke:#5b5bd6;stroke-width:2.5;stroke-dasharray:7 5;marker-end:url(#arrow)}
    .deployEdge{fill:none;stroke:#a33bab;stroke-width:2.5;marker-end:url(#deployArrow)}
  </style>

  <rect class="bg" width="1500" height="1000"/>
  <text class="title" x="48" y="48">Product Service | AWS Architecture</text>
  <rect class="outer" x="35" y="72" width="1430" height="860" rx="18"/>

  <text class="section" x="58" y="108">PUBLIC INTERNET</text>
  <rect class="internet" x="58" y="128" width="1384" height="220" rx="16"/>

  <rect class="card" x="82" y="168" width="150" height="130" rx="12"/>
  <text class="service" x="157" y="220" text-anchor="middle">Customer Browser</text>
  <text class="sub" x="157" y="246" text-anchor="middle">React customer experience</text>

  <rect class="card" x="310" y="168" width="150" height="130" rx="12"/>
  <text class="service" x="385" y="220" text-anchor="middle">Amazon CloudFront</text>
  <text class="sub" x="385" y="246" text-anchor="middle">HTTPS and caching</text>

  <rect class="card" x="538" y="168" width="150" height="130" rx="12"/>
  <text class="service" x="613" y="220" text-anchor="middle">Private Amazon S3</text>
  <text class="sub" x="613" y="246" text-anchor="middle">React frontend assets</text>

  <rect class="card" x="766" y="168" width="150" height="130" rx="12"/>
  <text class="service" x="841" y="220" text-anchor="middle">Amazon Cognito</text>
  <text class="sub" x="841" y="246" text-anchor="middle">Hosted UI and JWTs</text>

  <rect class="card" x="994" y="168" width="150" height="130" rx="12"/>
  <text class="service" x="1069" y="220" text-anchor="middle">AWS WAF</text>
  <text class="sub" x="1069" y="246" text-anchor="middle">Associated with ALB</text>

  <rect class="card" x="1222" y="168" width="150" height="130" rx="12"/>
  <text class="service" x="1297" y="220" text-anchor="middle">Public HTTPS ALB</text>
  <text class="sub" x="1297" y="246" text-anchor="middle">Port 80 redirects to 443</text>

  <path class="edge" d="M232 233H310"/><path class="edge" d="M460 233H538"/>
  <path class="edge" d="M916 233H994"/><path class="edge" d="M1144 233H1222"/>
  <path class="authEdge" d="M232 276H613V316H841V298"/>
  <text class="sub" x="498" y="306">Registration / login redirects</text>

  <text class="section" x="58" y="390">AWS VPC / NETWORK BOUNDARY</text>
  <rect class="publicNet" x="58" y="410" width="280" height="264" rx="16"/>
  <text class="section" x="82" y="442">Public subnets</text>
  <rect class="card" x="82" y="462" width="232" height="112" rx="12"/>
  <text class="service" x="198" y="504" text-anchor="middle">Internet-facing ALB</text>
  <text class="sub" x="198" y="530" text-anchor="middle">Production :443</text>
  <text class="sub" x="198" y="548" text-anchor="middle">Test listener :3001</text>

  <rect class="privateNet" x="358" y="410" width="584" height="264" rx="16"/>
  <text class="section" x="382" y="442">Private subnets</text>
  <rect class="card" x="382" y="462" width="150" height="112" rx="12"/>
  <text class="service" x="457" y="504" text-anchor="middle">ECS Fargate</text>
  <text class="sub" x="457" y="530" text-anchor="middle">Product API :3000</text>
  <text class="sub" x="457" y="548" text-anchor="middle">No public IP</text>
  <rect class="card" x="578" y="462" width="150" height="112" rx="12"/>
  <text class="service" x="653" y="504" text-anchor="middle">Blue target</text>
  <text class="sub" x="653" y="530" text-anchor="middle">Existing task set</text>
  <rect class="card" x="768" y="462" width="150" height="112" rx="12"/>
  <text class="service" x="843" y="504" text-anchor="middle">RDS MySQL</text>
  <text class="sub" x="843" y="530" text-anchor="middle">Private database</text>
  <text class="sub" x="843" y="548" text-anchor="middle">ECS-only ingress</text>
  <path class="edge" d="M314 518H382"/>
  <path class="edge" d="M532 518H578"/><path class="edge" d="M728 518H768"/>
  <text class="sub" x="382" y="610">Security groups: ALB to ECS to RDS. ECS credentials are retrieved from Secrets Manager.</text>

  <rect class="card" x="962" y="410" width="480" height="264" rx="16"/>
  <text class="section" x="986" y="442">Managed support and order processing</text>
  <rect class="card" x="986" y="462" width="202" height="88" rx="12"/>
  <text class="service" x="1087" y="500" text-anchor="middle">AWS Secrets Manager</text>
  <text class="sub" x="1087" y="526" text-anchor="middle">RDS username / password</text>
  <rect class="card" x="1210" y="462" width="208" height="88" rx="12"/>
  <text class="service" x="1314" y="500" text-anchor="middle">Amazon CloudWatch</text>
  <text class="sub" x="1314" y="526" text-anchor="middle">Logs and metrics</text>
  <rect class="card" x="986" y="566" width="202" height="88" rx="12"/>
  <text class="service" x="1087" y="604" text-anchor="middle">AWS Lambda</text>
  <text class="sub" x="1087" y="630" text-anchor="middle">Separate Orders handler</text>
  <rect class="card" x="1210" y="566" width="208" height="88" rx="12"/>
  <text class="service" x="1314" y="604" text-anchor="middle">Amazon DynamoDB</text>
  <text class="sub" x="1314" y="630" text-anchor="middle">Existing orders table</text>
  <path class="edge" d="M1188 610H1210"/>

  <text class="section" x="58" y="714">DELIVERY PIPELINE</text>
  <rect class="delivery" x="58" y="734" width="1384" height="150" rx="16"/>
  <rect class="card" x="82" y="790" width="170" height="70" rx="10"/>
  <text class="service" x="167" y="822" text-anchor="middle">GitHub</text>
  <text class="sub" x="167" y="844" text-anchor="middle">Source repository</text>
  <rect class="card" x="322" y="790" width="170" height="70" rx="10"/>
  <text class="service" x="407" y="822" text-anchor="middle">CodePipeline</text>
  <text class="sub" x="407" y="844" text-anchor="middle">Tests and release</text>
  <rect class="card" x="562" y="790" width="170" height="70" rx="10"/>
  <text class="service" x="647" y="822" text-anchor="middle">CodeBuild</text>
  <text class="sub" x="647" y="844" text-anchor="middle">Tests and image build</text>
  <rect class="card" x="802" y="790" width="170" height="70" rx="10"/>
  <text class="service" x="887" y="822" text-anchor="middle">Amazon ECR</text>
  <text class="sub" x="887" y="844" text-anchor="middle">Container images</text>
  <rect class="card" x="1042" y="790" width="170" height="70" rx="10"/>
  <text class="service" x="1127" y="822" text-anchor="middle">CodeDeploy</text>
  <text class="sub" x="1127" y="844" text-anchor="middle">Blue / green traffic shift</text>
  <rect class="card" x="1244" y="790" width="170" height="70" rx="10"/>
  <text class="service" x="1329" y="822" text-anchor="middle">ECS Fargate</text>
  <text class="sub" x="1329" y="844" text-anchor="middle">Blue / green service</text>
  <path class="deployEdge" d="M252 825H322"/><path class="deployEdge" d="M492 825H562"/>
  <path class="deployEdge" d="M732 825H802"/><path class="deployEdge" d="M972 825H1042"/>
  <path class="deployEdge" d="M1212 825H1244"/>
</svg>
